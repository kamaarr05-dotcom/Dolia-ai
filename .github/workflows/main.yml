name: DOLIA - Build Android & Server

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build DOLIA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Ekstrak ZIP dan temukan letak folder proyek
      - name: Extract Project Files & Locate Gradle Build
        run: |
          echo "=== 1. Mencari dan mengekstrak file ZIP jika ada ==="
          find . -maxdepth 3 -iname "*.zip" | while read -r zipfile; do
            echo "Mengekstrak $zipfile..."
            unzip -q -o "$zipfile" -d .
          done

          echo "=== 2. Mencari file settings.gradle atau settings.gradle.kts ==="
          SETTINGS_FILE=$(find . -name "settings.gradle*" | head -n 1)
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ ERROR: File settings.gradle atau settings.gradle.kts tidak ditemukan di repositori!"
            echo "Daftar file di dalam repositori saat ini:"
            find . -maxdepth 3
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Proyek Gradle ditemukan di: $PROJECT_DIR"

          if [ "$PROJECT_DIR" != "." ]; then
            echo "Memindahkan file proyek dari $PROJECT_DIR ke root..."
            cp -a "$PROJECT_DIR"/. .
            rm -rf "$PROJECT_DIR"
          fi

          echo "=== Struktur direktori root saat ini ==="
          ls -la

      # 2. Setup Node.js v20
      - name: Set up Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install Node.js Dependencies jika ada
      - name: Install Node.js Dependencies
        run: |
          if [ -f package.json ]; then
            npm install --silent || npm install
          fi
          if [ -d server ] && [ -f server/package.json ]; then
            cd server && (npm install --silent || npm install) && cd ..
          fi

      # 4. Setup Java JDK 21
      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 5. Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 6. Konfigurasi SDK, Lisensi, dan Kredensial
      - name: Setup Environment & Dependencies
        run: |
          echo "Menyetujui lisensi SDK dan menginstal Android Platform 36..."
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

          echo "Menyiapkan local.properties..."
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -d app ]; then
            echo "sdk.dir=$ANDROID_HOME" > app/local.properties
          fi

          echo "Menyiapkan file .env..."
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            echo "SUPABASE_URL=https://dummy.supabase.co" > .env
            echo "SUPABASE_ANON_KEY=dummy_anon_key" >> .env
          fi
          if [ -d app ]; then
            cp .env app/.env 2>/dev/null || true
          fi

          echo "Membuat debug.keystore jika belum ada..."
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -d app ]; then
            cp debug.keystore app/debug.keystore 2>/dev/null || true
          fi

          echo "Menyesuaikan gradle.properties untuk runner..."
          if [ -f gradle.properties ]; then
            sed -i 's/-Xmx4g/-Xmx2048m/g' gradle.properties
            sed -i 's/org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/g' gradle.properties
          fi

      # 7. Setup Gradle 9.3.1
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 8. Build Android APK
      - name: Build Android APK
        run: |
          # Temukan direktori proyek jika masih di subfolder
          SETTINGS_FILE=$(find . -name "settings.gradle*" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            echo "Berpindah ke direktori proyek Gradle: $PROJECT_DIR"
            cd "$PROJECT_DIR"
          fi

          echo "Menjalankan Gradle build di: $(pwd)"
          gradle assembleDebug --no-daemon --no-configuration-cache

      # 9. Upload APK ke tab Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dolia-app-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          retention-days: 14
