name: DOLIA - Build Android & Server

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build DOLIA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP if present
        run: |
          shopt -s nullglob nocaseglob
          zip_files=( *.zip */*.zip **/*.zip )
          if [ ${#zip_files[@]} -gt 0 ]; then
            for zf in "${zip_files[@]}"; do
              if [ -f "$zf" ]; then
                unzip -q -o "$zf" -d .
              fi
            done
          fi

          if [ ! -f "build.gradle.kts" ]; then
            GRADLE_PATH=$(find . -maxdepth 3 -name "build.gradle.kts" -not -path "*/app/*" | head -n 1)
            if [ -n "$GRADLE_PATH" ]; then
              TARGET_DIR=$(dirname "$GRADLE_PATH")
              shopt -s dotglob
              cp -r "$TARGET_DIR"/* .
              rm -rf "$TARGET_DIR"
            fi
          fi

      - name: Set up Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node.js Dependencies
        run: |
          if [ -f package.json ]; then
            npm install --silent || npm install
          fi
          if [ -d server ] && [ -f server/package.json ]; then
            cd server && (npm install --silent || npm install) && cd ..
          fi

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Environment & Dependencies
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -d app ]; then
            echo "sdk.dir=$ANDROID_HOME" > app/local.properties
          fi

          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            echo "SUPABASE_URL=https://dummy.supabase.co" > .env
            echo "SUPABASE_ANON_KEY=dummy_anon_key" >> .env
          fi
          if [ -d app ]; then
            cp .env app/.env 2>/dev/null || true
          fi

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -d app ]; then
            cp debug.keystore app/debug.keystore 2>/dev/null || true
          fi

          if [ -f gradle.properties ]; then
            sed -i 's/-Xmx4g/-Xmx2048m/g' gradle.properties
            sed -i 's/org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/g' gradle.properties
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Android APK
        run: |
          gradle assembleDebug --no-daemon --no-configuration-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dolia-app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
