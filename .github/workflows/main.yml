name: Build DOLIA APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      supabase_url:
        description: "Supabase URL"
        required: false
        type: string
        default: ""

      supabase_anon_key:
        description: "Supabase Anon Key"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: dolia-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v7

      # =========================================================
      # 2. EKSTRAK ZIP JIKA REPOSITORY BERISI FILE ZIP
      # =========================================================
      - name: Extract ZIP project if needed
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' ! -path './.git/*' | head -n 1 || true)"

          if [ -z "$ZIP_FILE" ]; then
            echo "Tidak ada ZIP project."
            echo "Menggunakan source yang sudah diekstrak."
            exit 0
          fi

          echo "ZIP ditemukan: $ZIP_FILE"

          TMP_DIR="$(mktemp -d)"

          unzip -q -o "$ZIP_FILE" -d "$TMP_DIR"

          PROJECT_ROOT="$(
            find "$TMP_DIR" \
              -type f \
              \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
              -print -quit |
              xargs -r dirname
          )"

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Root project Gradle tidak ditemukan di dalam ZIP."
            find "$TMP_DIR" -maxdepth 4 -type f | sort | head -n 100
            exit 1
          fi

          if [ ! -f "$PROJECT_ROOT/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT_ROOT/settings.gradle" ]; then
            echo "ERROR: settings.gradle(.kts) tidak ditemukan."
            exit 1
          fi

          echo "Root project hasil ekstraksi:"
          echo "$PROJECT_ROOT"

          rsync -a \
            --exclude '.git/' \
            "$PROJECT_ROOT/" \
            ./

          rm -rf "$TMP_DIR"

      # =========================================================
      # 3. CEK STRUKTUR PROJECT
      # =========================================================
      - name: Verify Android/Gradle project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "settings.gradle.kts" ] && \
             [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle(.kts) tidak ditemukan."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: folder app/ tidak ditemukan."
            exit 1
          fi

          echo "Project Android ditemukan."
          echo "Isi root:"
          ls -la

      # =========================================================
      # 4. JAVA 17
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # =========================================================
      # 5. GRADLE 9.3.1
      # =========================================================
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # =========================================================
      # 6. BUAT / VALIDASI GRADLE WRAPPER
      # =========================================================
      - name: Create or validate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "gradlew" ]; then
            echo "gradlew tidak ditemukan."
            echo "Membuat Gradle Wrapper 9.3.1..."

            gradle wrapper \
              --gradle-version 9.3.1 \
              --distribution-type bin
          else
            echo "Gradle Wrapper ditemukan."
          fi

          chmod +x gradlew

          echo "Memeriksa versi Gradle:"
          ./gradlew --version

      # =========================================================
      # 7. ANDROID SDK
      # =========================================================
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan:"
            echo "$SDKMANAGER"
            exit 1
          fi

          echo "Menerima Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo "Memasang Android SDK..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # =========================================================
      # 8. SUPABASE ENV
      # =========================================================
      - name: Prepare Supabase .env
        env:
          SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

          INPUT_SUPABASE_URL: ${{ inputs.supabase_url }}
          INPUT_SUPABASE_ANON_KEY: ${{ inputs.supabase_anon_key }}

        shell: bash
        run: |
          set -euo pipefail

          FINAL_URL="${INPUT_SUPABASE_URL:-${SECRET_SUPABASE_URL:-}}"
          FINAL_KEY="${INPUT_SUPABASE_ANON_KEY:-${SECRET_SUPABASE_ANON_KEY:-}}"

          echo "Memeriksa konfigurasi Supabase..."

          if [ -z "$FINAL_URL" ]; then
            echo "ERROR: SUPABASE_URL belum tersedia."
            echo "Pasang GitHub Secret SUPABASE_URL atau isi input workflow_dispatch."
            exit 1
          fi

          if [ -z "$FINAL_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY belum tersedia."
            echo "Pasang GitHub Secret SUPABASE_ANON_KEY atau isi input workflow_dispatch."
            exit 1
          fi

          case "$FINAL_URL" in
            https://*)
              ;;
            *)
              echo "ERROR: SUPABASE_URL harus menggunakan HTTPS."
              exit 1
              ;;
          esac

          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' \
            "$FINAL_URL" \
            "$FINAL_KEY" \
            > .env

          echo "Supabase .env berhasil disiapkan."

      # =========================================================
      # 9. DEBUG KEYSTORE
      # =========================================================
      - name: Prepare debug keystore
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "debug.keystore.base64" ]; then
            echo "Decode debug.keystore..."

            tr -d '\r\n ' \
              < debug.keystore.base64 |
              base64 -d > debug.keystore
          fi

          if [ ! -s "debug.keystore" ]; then
            echo "Membuat debug.keystore baru..."

            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          chmod +x gradlew

      # =========================================================
      # 10. BUILD APK
      # =========================================================
      - name: Build Android APK Debug
        shell: bash
        run: |
          set -o pipefail

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=2 \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee gradle-build.log

      # =========================================================
      # 11. UPLOAD APK
      # =========================================================
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DOLIA-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # =========================================================
      # 12. UPLOAD LOG JIKA GAGAL
      # =========================================================
      - name: Upload Gradle build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DOLIA-Gradle-Log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 7
