name: Build DOLIA APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      supabase_url:
        description: 'Supabase URL (contoh: https://xyz.supabase.co)'
        required: false
        default: ''
      supabase_anon_key:
        description: 'Supabase Anon Key'
        required: false
        default: ''

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Ekstrak ZIP secara otomatis jika Anda mengunggah arsip .zip ke repository
      - name: Extract Zip (if uploaded as archive)
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Menemukan arsip zip: $ZIP_FILE. Mengekstrak..."
            unzip -q -o "$ZIP_FILE" -d .
            if [ ! -d "app" ]; then
              NESTED_APP=$(find . -maxdepth 2 -name "app" -type d | head -n 1)
              if [ -n "$NESTED_APP" ]; then
                NESTED_DIR=$(dirname "$NESTED_APP")
                echo "Memindahkan file dari $NESTED_DIR ke root..."
                cp -rn "$NESTED_DIR"/* . || true
              fi
            fi
          fi

      # 2. Setup Node.js v20
      - name: Set up Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Setup Java JDK 21
      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # 4. Setup Gradle 9.3.1 (Memenuhi syarat minimal AGP 9.1.1)
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 5. Setujui Lisensi Android SDK & Siapkan SDK 36
      - name: Accept Android SDK Licenses & Prepare SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" 2>/dev/null || true

      # 6. Siapkan konfigurasi Android, Keystore, dan Supabase .env
      - name: Prepare Android Project & Supabase Config
        env:
          SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          INPUT_SUPABASE_URL: ${{ inputs.supabase_url }}
          INPUT_SUPABASE_ANON_KEY: ${{ inputs.supabase_anon_key }}
        run: |
          mkdir -p gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "networkTimeout=10000" >> gradle/wrapper/gradle-wrapper.properties
          echo "validateDistributionUrl=true" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties

          # Siapkan .env Supabase
          FINAL_URL="${INPUT_SUPABASE_URL:-${SECRET_SUPABASE_URL}}"
          FINAL_KEY="${INPUT_SUPABASE_ANON_KEY:-${SECRET_SUPABASE_ANON_KEY}}"

          if [ -n "$FINAL_URL" ] && [ -n "$FINAL_KEY" ]; then
            echo "Menginjeksi kredensial Supabase ke .env..."
            printf "SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n" "$FINAL_URL" "$FINAL_KEY" > .env
          elif [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Siapkan debug.keystore (Decode base64 dengan aman)
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore dari base64..."
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore 2>/dev/null || true
          fi

          # Pastikan file debug.keystore valid dan tidak 0 byte
          if [ ! -s debug.keystore ]; then
            echo "Membuat debug.keystore default dengan keytool..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      # 7. Kompilasi dan Build APK Debug
      - name: Build Android APK
        run: |
          gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

      # 8. Upload APK ke tab Artifacts GitHub agar bisa langsung diunduh
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOLIA-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
