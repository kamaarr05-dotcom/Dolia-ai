name: DOLIA - Build Android & Server

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build DOLIA (JDK 21 & Node.js 20)
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Ekstrak ZIP jika ada file .zip yang diunggah langsung ke repository
      - name: Extract ZIP if present
        run: |
          echo "Memeriksa apakah terdapat file ZIP di repository..."
          if ls *.zip 1> /dev/null 2>&1; then
            echo "File ZIP ditemukan. Memulai proses ekstraksi..."
            for file in *.zip; do
              echo "Mengekstrak $file..."
              unzip -o "$file"
            done
            echo "Ekstraksi selesai."
          else
            echo "Tidak ada file ZIP terkompresi. Melanjutkan dengan struktur repositori saat ini."
          fi

      # 3. Setup Node.js v20
      - name: Set up Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. Install dependensi Node.js
      - name: Install Node.js Dependencies
        run: |
          echo "Versi Node.js:"
          node -v
          echo "Versi NPM:"
          npm -v
          if [ -f package.json ]; then
            npm install
          fi
          if [ -d server ] && [ -f server/package.json ]; then
            cd server && npm install && cd ..
          fi

      # 5. Setup Java JDK 21
      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # 6. Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 7. Siapkan Environment (.env & debug.keystore)
      - name: Setup Environment and Debug Keystore
        run: |
          # Buat file .env dari .env.example jika belum ada
          if [ ! -f .env ] && [ -f .env.example ]; then
            echo "Menyiapkan file .env dari .env.example..."
            cp .env.example .env
          fi

          # Buat debug.keystore jika belum ada (dibutuhkan oleh app/build.gradle.kts)
          if [ ! -f debug.keystore ]; then
            echo "Membuat debug.keystore otomatis untuk proses signing debug..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # 8. Setup Gradle Wrapper & Hak Akses
      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew tidak ditemukan, menginstal gradle dan men-generate wrapper..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      # 9. Build Android APK (Debug)
      - name: Build Android APK with Gradle
        run: |
          echo "Memulai build Android APK..."
          ./gradlew assembleDebug --stacktrace

      # 10. Unggah APK ke GitHub Actions Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolia-app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
